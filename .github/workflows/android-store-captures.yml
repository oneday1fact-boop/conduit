name: Android game screenshot capture
on:
  push:
    branches: ['feature/pro-cloud-sync']
    paths:
      - '.github/workflows/android-store-captures.yml'
      - 'scripts/capture-android-store.py'
      - 'www/**'
      - 'android/app/src/main/java/**'
      - 'android/app/build.gradle'
  pull_request:
    paths:
      - '.github/workflows/android-store-captures.yml'
      - 'scripts/capture-android-store.py'
      - 'www/**'
      - 'android/app/src/main/java/**'
      - 'android/app/build.gradle'
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build existing Android debug game
        run: |
          npm ci
          npx cap sync android
          cd android
          bash ./gradlew :app:assembleDebug --no-daemon
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 scripts/capture-android-store.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conduit-actual-android-captures
          path: store-captures/
          retention-days: 7
