name: CONDUIT source validation

on:
  push:
    branches: [main, android-release-preparation-20261027]
  pull_request:

jobs:
  check-source:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate puzzle library and release file structure
        run: node scripts/validate-source.cjs
      - name: Verify release preparation and cleanup
        run: node scripts/test-release-build.cjs
      - name: Check service worker syntax
        run: node --check www/service-worker.js
      - name: Check web manifest JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('www/manifest.webmanifest','utf8'))"

  android-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked dependencies and sync development assets
        run: |
          npm ci
          npx cap sync android
      - name: Compile Android debug variant without release signing
        working-directory: android
        run: bash ./gradlew :app:assembleDebug --no-daemon
